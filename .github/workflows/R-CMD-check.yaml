# R CMD check plus the full test suite.
#
# Dependencies come from DESCRIPTION only (Imports, Depends, LinkingTo and the
# declared Suggests), so a package used in R/ but missing from DESCRIPTION
# fails here instead of on Posit Connect. Benchmarks are not run on shared CI.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned to DESCRIPTION's RoxygenNote: 8.x writes NAMESPACE
          # in a different layout and would fail the NAMESPACE diff below.
          extra-packages: any::rcmdcheck any::devtools roxygen2@7.3.3
          needs: check

      # man/ is generated and not tracked, so document before checking. A
      # NAMESPACE that changes here was committed out of sync with the roxygen
      # tags.
      - name: Document and verify NAMESPACE
        shell: bash
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code NAMESPACE

      # Fails on errors only for now: the roxygen blocks of about 25 functions
      # lack @param entries, which R CMD check reports as WARNINGs (tracked in
      # review/REVIEW-2026-10-06-tracking.md, R2-CQ-01). Tighten to "warning"
      # once those are documented.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
          # Tests run once, in the "Tests" step, from the checkout: manifest.json,
          # batch/ and the R/ sources that the contract tests scan are not part
          # of the built package.
          args: 'c("--no-manual", "--as-cran", "--no-tests")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      # The h3 weather fixtures install the DuckDB h3 community extension on
      # first use; cache it so most runs do not depend on that download.
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}

      - name: Tests
        shell: Rscript {0}
        run: |
          options(testthat.progress.max_fails = 1000)
          testthat::test_local(stop_on_failure = TRUE)

  lintr:
    runs-on: ubuntu-latest
    # Informational only until the existing findings are worked down.
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: lint
      - name: Lint
        shell: Rscript {0}
        run: lintr::lint_package()
